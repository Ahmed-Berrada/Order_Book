name: Benchmarks

# Wall-clock numbers on a shared runner are noisy, so this is run on demand and its output kept as an
# artifact for comparison; it is not a gate (docs/adr/0016-performance-and-the-queue.md §4).
on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # One cache for the dependencies and the Maven distribution the wrapper downloads. On a miss (a version
      # bump changes the key) the closest older cache is restored, so only what changed comes from Maven
      # Central, which rate-limits runners that download everything (HTTP 429).
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ github.job }}-
            maven-${{ runner.os }}-

      - name: Build the benchmarks
        run: ./mvnw -B -ntp -DskipTests package -pl engine-bench -am

      - name: JMH
        run: java -jar engine-bench/target/benchmarks.jar -rf text -rff jmh.txt

      - name: Latency
        run: |
          for mode in engine journal; do
            java -cp engine-bench/target/benchmarks.jar io.github.ahmedberrada.lob.bench.LatencyRun $mode | tee -a latency.txt
          done

      - uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: |
            jmh.txt
            latency.txt
