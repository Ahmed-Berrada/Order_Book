{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "lob-engine.name" . }}
  labels: {{- include "lob-engine.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "lob-engine.labels" . | nindent 6 }}
  endpoints:
    - port: rest
      path: /actuator/prometheus
      {{- if .Values.tls.inPod }}
      scheme: https
      {{- end }}
{{- end }}
