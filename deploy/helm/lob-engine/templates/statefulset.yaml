# A StatefulSet of one: a stable identity for the volume, and the guarantee that a new pod never starts
# while the old one still holds the journal (the pod is stopped first). The journal lock (RS-011) is the
# last line of defence if that guarantee is ever broken.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "lob-engine.name" . }}
  labels: {{- include "lob-engine.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "lob-engine.name" . }}
  selector:
    matchLabels: {{- include "lob-engine.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "lob-engine.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 60      # lets queued commands finish and the journals be forced (OE-007)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: lob-engine
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: rest, containerPort: 8080}
            - {name: fix, containerPort: 9878}
          env:
            {{- range $k, $v := .Values.env }}
            - {name: {{ $k }}, value: {{ $v | quote }}}
            {{- end }}
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef: {name: {{ .Values.existingSecret }}}
          {{- end }}
          # Slow recovery is normal after a crash (the journal is replayed): the startup probe waits for it.
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: rest}
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: rest}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: rest}
            periodSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
