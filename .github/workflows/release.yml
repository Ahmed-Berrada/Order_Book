name: Release

# A tag v* builds the release with its software bill of materials and signs what it built: GitHub
# attestations (Sigstore) record that these exact files were produced by this workflow from this commit
# (SLSA build provenance). Verify with:  gh attestation verify <file> --repo <owner>/<repo>
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # One cache for the dependencies and the Maven distribution the wrapper downloads. On a miss (a version
      # bump changes the key) the closest older cache is restored, so only what changed comes from Maven
      # Central, which rate-limits runners that download everything (HTTP 429).
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ github.job }}-
            maven-${{ runner.os }}-

      - name: Build, test and produce the SBOM
        run: ./mvnw -B -ntp -Psbom verify

      - name: Collect the artifacts
        run: |
          mkdir release
          cp api/target/*.jar release/ 2>/dev/null || true
          cp engine-bench/target/benchmarks.jar release/ 2>/dev/null || true
          cp target/lob-engine-bom.json release/
          cd release && sha256sum * > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release/*'

      - name: Attest the SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-path: 'release/*.jar'
          sbom-path: 'release/lob-engine-bom.json'

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
