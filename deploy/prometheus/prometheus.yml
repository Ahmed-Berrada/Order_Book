global:
  scrape_interval: 15s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: lob-engine
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["lob:8080"]
    # With security on, scrape with the credentials of a READ user:
    # basic_auth: {username: metrics, password_file: /etc/prometheus/metrics-password}
