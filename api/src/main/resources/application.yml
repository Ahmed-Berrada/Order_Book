# No authentication until phase 8: listen on the loopback interface unless deliberately opened.
server:
  address: ${LOB_BIND_ADDRESS:127.0.0.1}

spring:
  application:
    name: lob-engine
  jackson:
    deserialization:
      # ADR-0005 §3: on order entry, an unknown field or a fractional quantity is an error.
      fail-on-unknown-properties: true
      accept-float-as-int: false
  mvc:
    async:
      request-timeout: 5s
    problemdetails:
      enabled: true

# The venue (ADR-0005 §5). Instruments are declared at startup, like on a real exchange.
lob:
  data-directory: ${LOB_DATA_DIR:./data}
  queue-capacity: 10000
  fsync: EVERY_COMMAND
  snapshot-interval: 10000
  # FIX 4.4 order entry (docs/interfaces/fix-rules-of-engagement.md). Sessions are provisioned here.
  fix:
    enabled: true
    bind-address: ${LOB_BIND_ADDRESS:127.0.0.1}
    port: 9878
    sender-comp-id: LOB
    members: [MEMBER1, MEMBER2]
    drop-copy-sessions: [RISK]
    # What happens when a member's order meets its own resting order (docs/rulebook/self-trade-prevention.md)
    self-trade-mode: CANCEL_NEWEST
  # Binary market data (docs/interfaces/market-data-binary.md): UDP stream + TCP recovery service.
  binary-feed:
    enabled: true
    stream-host: 127.0.0.1
    stream-port: 9900
    service-address: ${LOB_BIND_ADDRESS:127.0.0.1}
    service-port: 9901
  instruments:
    - symbol: AAPL
      tick-size: "0.01"
      max-order-quantity: 1000000
      max-price: "100000.00"
      # Optional controls (docs/rulebook/tick-size-regime.md, volatility-interruptions.md). Changing them
      # for an instrument that already has a journal is refused: they are part of its definition.
      # tick-regime:
      #   - {from-price: "0.01", step: "0.01"}
      #   - {from-price: "50.00", step: "0.05"}
      # volatility-band-bps: 500
    - symbol: MSFT
      tick-size: "0.01"
      max-order-quantity: 1000000
      max-price: "100000.00"
