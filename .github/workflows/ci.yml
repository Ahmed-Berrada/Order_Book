name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # One cache for the dependencies and the Maven distribution the wrapper downloads. On a miss (a version
      # bump changes the key) the closest older cache is restored, so only what changed comes from Maven
      # Central, which rate-limits runners that download everything (HTTP 429).
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ github.job }}-
            maven-${{ runner.os }}-

      # Tests, property tests, ArchUnit rules, rulebook traceability and the JaCoCo 90 % gate.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: |
            engine-core/target/site/jacoco/
            engine-journal/target/site/jacoco/
            engine-service/target/site/jacoco/
            fix-gateway/target/site/jacoco/
            market-data/target/site/jacoco/
            post-trade/target/site/jacoco/
            api/target/site/jacoco/
          if-no-files-found: ignore

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # One cache for the dependencies and the Maven distribution the wrapper downloads. On a miss (a version
      # bump changes the key) the closest older cache is restored, so only what changed comes from Maven
      # Central, which rate-limits runners that download everything (HTTP 429).
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ github.job }}-
            maven-${{ runner.os }}-

      # ADR-0002 §7: PIT mutation score of each engine module must stay at or above 80 %.
      - name: Mutation testing
        run: ./mvnw -B -ntp -pl engine-core,engine-journal,engine-service,market-data,post-trade -am -Pmutation verify

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pit-report
          path: |
            engine-core/target/pit-reports/
            engine-journal/target/pit-reports/
            engine-service/target/pit-reports/
            market-data/target/pit-reports/
            post-trade/target/pit-reports/
          if-no-files-found: ignore

  # Phase 10b: the Python analytics, standard library only (docs/analytics.md).
  analytics:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        working-directory: analytics
        run: python -m unittest discover -s tests -t . -v
