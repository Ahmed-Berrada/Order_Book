apiVersion: v1
kind: Service
metadata:
  name: {{ include "lob-engine.name" . }}
  labels: {{- include "lob-engine.labels" . | nindent 4 }}
spec:
  selector: {{- include "lob-engine.labels" . | nindent 4 }}
  ports:
    - {name: rest, port: {{ .Values.service.restPort }}, targetPort: rest}
    - {name: fix, port: {{ .Values.service.fixPort }}, targetPort: fix}
