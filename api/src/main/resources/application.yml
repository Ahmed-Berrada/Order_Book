# Authentication is on by default (lob.security): the venue will not start without users. Listen on the loopback
# interface unless deliberately opened, and put TLS in front of anything else.
server:
  address: ${LOB_BIND_ADDRESS:127.0.0.1}

spring:
  application:
    name: lob-engine
  jackson:
    deserialization:
      # ADR-0005 §3: on order entry, an unknown field or a fractional quantity is an error.
      fail-on-unknown-properties: true
      accept-float-as-int: false
  mvc:
    async:
      request-timeout: 5s
    problemdetails:
      enabled: true

# The venue (ADR-0005 §5). Instruments are declared at startup, like on a real exchange.
lob:
  data-directory: ${LOB_DATA_DIR:./data}
  queue-capacity: 10000
  # GROUP: every acknowledged command is on the device, one flush per group of waiting commands (ADR-0020).
  fsync: GROUP
  snapshot-interval: 10000
  # Throttles on each member's messages (OE-008, OE-009, ADR-0021); 0 switches one off.
  throttle:
    messages-per-second: 1000
    max-order-to-trade-ratio: 1000
    order-to-trade-minimum: 1000
  # FIX 4.4 order entry (docs/interfaces/fix-rules-of-engagement.md). Sessions are provisioned here.
  fix:
    enabled: true
    bind-address: ${LOB_BIND_ADDRESS:127.0.0.1}
    port: 9878
    sender-comp-id: LOB
    members: [MEMBER1, MEMBER2]
    drop-copy-sessions: [RISK]
    # What happens when a member's order meets its own resting order (docs/rulebook/self-trade-prevention.md)
    self-trade-mode: CANCEL_NEWEST
  # Binary market data (docs/interfaces/market-data-binary.md): UDP stream + TCP recovery service.
  binary-feed:
    enabled: true
    stream-host: 127.0.0.1
    stream-port: 9900
    service-address: ${LOB_BIND_ADDRESS:127.0.0.1}
    service-port: 9901
  instruments:
    - symbol: AAPL
      tick-size: "0.01"
      max-order-quantity: 1000000
      max-price: "100000.00"
      # Optional controls (docs/rulebook/tick-size-regime.md, volatility-interruptions.md). Changing them
      # for an instrument that already has a journal is refused: they are part of its definition.
      # tick-regime:
      #   - {from-price: "0.01", step: "0.01"}
      #   - {from-price: "50.00", step: "0.05"}
      # volatility-band-bps: 500
    - symbol: MSFT
      tick-size: "0.01"
      max-order-quantity: 1000000
      max-price: "100000.00"
  # Members and their pre-trade limits per instrument (docs/rulebook/members-and-risk.md). A limit of 0 means
  # none. A FIX session in no member takes a member ID derived from its CompID.
  # members:
  #   - id: 1
  #     name: Alpha Capital
  #     fix-comp-ids: [MEMBER1]
  #     limits:
  #       max-order-quantity: 10000
  #       max-order-notional: "2000000.00"
  #       price-collar-bps: 500
  #       max-open-orders: 500
  #       max-net-position: 50000

# Operations (docs/operations/observability.md). Health is open (status only); metrics need the READ role.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,lob
  # Traces (ADR-0023): one span per REST request and per command, sampled at 10%. They are exported over OTLP only
  # when an endpoint is set, e.g. MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://collector:4318/v1/traces.
  tracing:
    sampling:
      probability: 0.1
    # Only W3C traceparent is read from callers, and no baggage is carried (ADR-0023 §3).
    propagation:
      consume: w3c
      produce: w3c
    baggage:
      enabled: false
  metrics:
    distribution:
      # lob_request_seconds as a histogram, for its quantiles; 50 µs to 10 s covers an acknowledged command.
      percentiles-histogram:
        lob.request: true
      minimum-expected-value:
        lob.request: 50us
      maximum-expected-value:
        lob.request: 10s
  # Logs stay on standard output, with the trace and span IDs in each line; they are not sent over OTLP.
  logging:
    export:
      otlp:
        enabled: false
logging:
  level:
    # The REST authentication provider is defined on purpose (AC-009, ThrottledAuthentication): not a mistake to warn of.
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
